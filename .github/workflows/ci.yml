name: CircuitPedal CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Woolly working-board DC report
        run: |
          ./build/circuitpedal_validate dc-check \
            circuits/woolly_mammoth_reference_draft.cpedal \
            validation/woolly_mammoth/working_board_dc.csv \
            --source VCCSRC=9.33 \
            --control WOOL=1 \
            --control PINCH=1 \
            --control EQ=1 \
            --control OUTPUT=1
      - name: Broken-model DC diagnostics
        run: |
          echo "=== Fuzz Factory ==="
          ./build/circuitpedal_validate dc \
            circuits/fuzz_factory_reference.cpedal \
            --sample-rate 48000 \
            --control STAB=1 --control GATE=0 --control COMP=0.2 \
            --control DRIVE=0.5 --control VOLUME=0.3 \
            --node Q1B --node Q1C --node Q2B --node Q2C \
            --node Q3E --node Q3C --node OUT
          echo "=== Fuzzolo ==="
          ./build/circuitpedal_validate dc \
            circuits/fuzzolo_reference_draft.cpedal \
            --sample-rate 48000 \
            --control PULSE_WIDTH=0.5 --control VOLUME=0.55 \
            --switch PICKUPS=0 \
            --node Q1B --node Q1C --node Q2C --node Q2E \
            --node Q3G --node Q3D --node Q3S --node OUT
          echo "=== EQD Tentacle ==="
          ./build/circuitpedal_validate dc \
            circuits/eqd_tentacle_reference_draft.cpedal \
            --sample-rate 48000 \
            --node Q1_BASE --node Q1_COLLECTOR \
            --node Q2_EMITTER --node Q2_COLLECTOR --node RECT_BIAS \
            --node Q3_BASE --node Q3_EMITTER --node OUT
          echo "=== Blueberry Bass Overdrive ==="
          ./build/circuitpedal_validate dc \
            circuits/blueberry_bass_overdrive_reference_draft.cpedal \
            --sample-rate 48000 \
            --control DRIVE=0.55 --control TONE=0.5 --control VOLUME=0.55 \
            --node VA --node VB --node OP_PLUS --node OP_MINUS --node OP_OUT \
            --node CLAMP_A --node CLAMP_B --node Q1G --node Q1D --node Q1S --node OUT
          echo "=== Animato ==="
          ./build/circuitpedal_validate dc \
            circuits/animato_reference_draft.cpedal \
            --sample-rate 48000 \
            --control BOOST=0.65 --control DISTORTION=0.65 \
            --control TONE=0.5 --control VOLUME=0.55 \
            --node Q1B --node PAIR_E --node PAIR_C \
            --node Q3C --node Q4C --node Q5C --node Q6C --node Q7E --node OUT
      - name: Confirm macOS GUI bundle
        if: runner.os == 'macOS'
        run: |
          test -x build/CircuitPedalGUI.app/Contents/MacOS/CircuitPedalGUI
          test -f build/CircuitPedalGUI.app/Contents/Resources/circuits/woolly_mammoth_reference_draft.cpedal
          test -f build/CircuitPedalGUI.app/Contents/Resources/circuits/fuzz_factory_reference.cpedal
          test -f build/CircuitPedalGUI.app/Contents/Resources/circuits/fat_fuzz_factory_reference.cpedal
          test -f build/CircuitPedalGUI.app/Contents/Resources/circuits/fuzzolo_reference_draft.cpedal
          test -f build/CircuitPedalGUI.app/Contents/Resources/circuits/ts10_reference_draft.cpedal
          test -f build/CircuitPedalGUI.app/Contents/Resources/circuits/animato_reference_draft.cpedal
          test -f build/CircuitPedalGUI.app/Contents/Resources/circuits/kalamazoo_reference_draft.cpedal
          test -f build/CircuitPedalGUI.app/Contents/Resources/circuits/big_muff_nyc.cpedal
          test -f build/CircuitPedalGUI.app/Contents/Resources/circuits/naga_viper.cpedal
          test -f build/CircuitPedalGUI.app/Contents/Resources/circuits/eqd_tentacle_reference_draft.cpedal

  sanitizer-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizers
        run: >-
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DCIRCUITPEDAL_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Test with AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure

  ngspice-reference-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Build validation CLI
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target circuitpedal_validate
      - name: Validate normalized reference columns
        run: |
          validation/woolly_mammoth/run_ngspice.sh build/validation/woolly
          build/circuitpedal_validate compare \
            build/validation/woolly/woolly_mammoth_ngspice.csv \
            build/validation/woolly/woolly_mammoth_ngspice.csv \
            --column node_C2_NODE_v \
            --start 0.1 --duration 0.1 \
            --fundamental 110 --harmonics 5 \
            --max-nrms 0.000001 --max-peak 0.000001 \
            --min-correlation 0.999999 --max-gain-db 0.000001 \
            --max-thd-db 0.000001
      - name: Compare Woolly candidate across control states
        run: |
          validation/woolly_mammoth/run_candidate_comparison.sh \
            build/circuitpedal_validate \
            build/validation/woolly-campaign
      - name: Upload Woolly comparison artifacts
        uses: actions/upload-artifact@v4
        with:
          name: woolly-candidate-comparison
          path: build/validation/woolly-campaign
