name: CircuitPedal UI Sandbox Pages

on:
  push:
    branches: [feature/ui-html-prototype]
    paths:
      - 'ui-prototype/**'
      - '.github/workflows/ui-prototype-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ui-prototype-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload UI sandbox
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui-prototype
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
