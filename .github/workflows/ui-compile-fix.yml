name: UI Compile Fix

permissions:
  contents: write

on:
  push:
    branches: [feature/circuit-lab-ui]

jobs:
  patch-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/circuit-lab-ui
      - name: Apply focused Objective-C++ fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main_mac_gui.mm')
          text = path.read_text()
          old = '''    [[self.active ? [liveColor() colorWithAlphaComponent:0.18]\n                  : [NSColor colorWithWhite:0.3 alpha:0.08]] setFill];'''
          new = '''    NSColor* glowColor = self.active\n        ? [liveColor() colorWithAlphaComponent:0.18]\n        : [NSColor colorWithWhite:0.3 alpha:0.08];\n    [glowColor setFill];'''
          if old not in text:
              raise SystemExit('Expected status-dot expression not found')
          text = text.replace(old, new, 1)
          text = text.replace('@property(copy) NSString* selectedName;', '@property(nonatomic, copy) NSString* selectedName;', 1)
          text = text.replace('@property(copy) NSString* pedalName;', '@property(nonatomic, copy) NSString* pedalName;', 1)
          text = text.replace('@property(copy) NSString* pedalType;', '@property(nonatomic, copy) NSString* pedalType;', 1)
          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main_mac_gui.mm
          git commit -m "Fix concept shell macOS compilation"
          git push origin HEAD:feature/circuit-lab-ui
