name: One-shot routing editor runner

on:
  push:
    branches:
      - feature/ui-html-prototype
    paths:
      - '.github/workflows/ui-routing-editor-run.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-html-prototype
          fetch-depth: 0
      - run: python3 .github/scripts/patch_ui_routing.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-prototype/app.html ui-prototype/sw.js
          git commit -m "Add freeform signal-chain editor and master IO controls"
          git push origin HEAD:feature/ui-html-prototype
